[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="production-log-eval-miner"
version="0.1.0"
description="PII-safe log sampling, clustering, auto-labeling, curation, and regression tracking"
readme="README.md"
requires-python=">=3.11"
license={text="MIT"}
dependencies=[
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev=["pytest>=8.0","httpx>=0.27"]
dashboard=["streamlit>=1.36","pandas>=2.0"]


[project.scripts]
eval-miner="eval_miner.cli:main"

[tool.setuptools.packages.find]
where=["src"]
